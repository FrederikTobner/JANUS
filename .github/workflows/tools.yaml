name: Tools

on:
  push:
    branches: ["main", "master"]
    paths:
      - "tools/**"
      - ".github/workflows/tools.yaml"
      - ".clang-format"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "tools/**"
      - ".github/workflows/tools.yaml"
      - ".clang-format"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env
        with:
          analysis: true

      - name: Check formatting
        run: find tools -type d -name 'build*' -prune -o -type f \( -name '*.c' -o -name '*.h' \) -print | xargs clang-format --dry-run --Werror

  build-and-test:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env
        with:
          compiler: ${{ matrix.compiler }}
          packages: cmake ninja-build zlib1g-dev

      - name: Configure
        run: >
          cmake -S tools -B build-tools
          -G Ninja
          -D CMAKE_BUILD_TYPE=Release
          -D CMAKE_C_COMPILER=${{ matrix.compiler }}
          -D JANUS_TOOLS_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build build-tools

      - name: Test
        run: ctest --test-dir build-tools --output-on-failure

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env
        with:
          packages: cmake ninja-build zlib1g-dev gcovr

      - name: Configure with coverage instrumentation
        run: >
          cmake -S tools -B build-tools-coverage
          -G Ninja
          -D CMAKE_BUILD_TYPE=Debug
          -D CMAKE_C_COMPILER=gcc
          -D JANUS_TOOLS_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build-tools-coverage

      - name: Run tests
        run: ctest --test-dir build-tools-coverage --output-on-failure

      - name: Generate HTML coverage report
        run: |
          mkdir -p coverage
          gcovr \
            --root tools \
            --object-directory build-tools-coverage \
            --exclude '.*/tests/.*' \
            --exclude '.*/googletest/.*' \
            --html-details coverage/index.html \
            --html-title "JANUS Tools — Coverage Report" \
            --print-summary

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

