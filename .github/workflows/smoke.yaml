name: Kernel Smoke Tests

on:
  push:
    branches: ["main", "master"]
    paths:
      - "kernel/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/smoke.yaml"
      - ".github/actions/**"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "kernel/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/smoke.yaml"
      - ".github/actions/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: ${{ matrix.preset }} (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [x86_64-gcc, x86_64-clang, aarch64-gcc, aarch64-clang]
        profile: [nominal, fault, kmalloc]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env
        with:
          arch: ${{ startsWith(matrix.preset, 'aarch64') && 'aarch64' || 'x86_64' }}
          compiler: ${{ endsWith(matrix.preset, 'clang') && 'clang' || 'gcc' }}
          kernel: true
          qemu: true

      - name: Configure (${{ matrix.profile }})
        run: >
          cmake --preset ${{ matrix.preset }}
          -D JANUS_ENABLE_SMOKE_TESTS=ON
          ${{ matrix.profile == 'fault' && '-D JANUS_TEST_FAULTS=ON' || '' }}
          ${{ matrix.profile == 'kmalloc' && '-D JANUS_TEST_KMALLOC=ON' || '' }}

      - name: Smoke test
        run: ctest --preset ${{ matrix.preset }} -R smoke

      - name: Upload serial logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-serial-${{ matrix.preset }}-${{ matrix.profile }}
          path: build-${{ matrix.preset }}/smoke-*.log
          if-no-files-found: ignore
